services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: draftroom
      POSTGRES_USER: draftroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draftroom -d draftroom"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://draftroom:${POSTGRES_PASSWORD}@db:5432/draftroom
      PORT: "8080"
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      RUST_LOG: info
      DB_MAX_CONNECTIONS: "10"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
